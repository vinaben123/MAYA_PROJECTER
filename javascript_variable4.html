<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>const declaration </title>
</head>
<body bgcolor="lightgreen">
    <h2>javascript const</h2>
    <p id="demo"></p>
    <p id="demol"></p>
    <script>
        //create an array :
        const mobile=["Iphone","redmi","oppo"];
        //display the array:
        document.getElementById("demo").innerHTML=mobile;
        //change an element :
        mobile[1]="oneplus";

        //add an element :
        mobile.push("motto");

        //display the array:
        document.getElementById("demol").innerHTML=mobile;
    </script>
    
</body>
</html>
